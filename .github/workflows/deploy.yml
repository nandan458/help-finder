# Checks, builds, and publishes the app to GitHub Pages every time code is
# pushed to the main branch. If the lint or the tests fail, nothing is published,
# so a broken version never goes live.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # adds a "Run workflow" button on GitHub, to publish by hand

# Only what's needed: read the code, publish to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# If two pushes happen close together, only publish the newest one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm test

      # Tells us the site's address, like https://<you>.github.io/help-finder/
      - id: pages
        uses: actions/configure-pages@v6

      - run: npm run build
        env:
          # The folder the site lives in (for example /help-finder/). See vite.config.ts.
          BASE_PATH: ${{ steps.pages.outputs.base_path }}/

      # Add the offline packs built by packs.yml, if there are any yet.
      - uses: actions/checkout@v7
        with:
          ref: packs
          path: packs-data
        continue-on-error: true
      - name: Add packs to the site
        run: |
          if [ -f packs-data/index.json ]; then
            mkdir -p dist/packs
            cp -r packs-data/t packs-data/index.json dist/packs/
            echo "Added $(ls dist/packs/t | wc -l) pack files"
          else
            echo "No packs yet; the app will use the live server."
          fi

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
