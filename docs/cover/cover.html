<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>NearAid cover</title>
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1280px; height: 720px; }
  body {
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    color: #fff;
    background:
      radial-gradient(circle at 85% 20%, rgb(255 255 255 / 0.12), transparent 40%),
      radial-gradient(circle at 10% 95%, rgb(0 0 0 / 0.18), transparent 45%),
      linear-gradient(150deg, #0a66c2, #0f766e);
    display: grid;
    grid-template-columns: 560px 1fr;
    align-items: center;
    padding: 0 64px;
    overflow: hidden;
  }
  .brand { display: flex; align-items: center; gap: 20px; }
  .brand img { width: 96px; height: 96px; border-radius: 24px; box-shadow: 0 8px 24px rgb(0 0 0 / 0.3); }
  h1 { font-size: 84px; font-weight: 800; letter-spacing: -1px; line-height: 1; }
  .tagline { margin-top: 28px; font-size: 38px; font-weight: 600; line-height: 1.2; }
  .sub { margin-top: 14px; font-size: 22px; opacity: 0.9; line-height: 1.4; max-width: 470px; }
  .chips { margin-top: 30px; display: flex; flex-wrap: wrap; gap: 10px; max-width: 480px; }
  .chip { padding: 9px 16px; border-radius: 999px; background: rgb(255 255 255 / 0.18);
          border: 1px solid rgb(255 255 255 / 0.35); font-size: 18px; font-weight: 600; }
  .phones { position: relative; height: 720px; }
  .phone { position: absolute; width: 230px; border-radius: 34px; padding: 9px; background: #111;
           box-shadow: 0 24px 50px rgb(0 0 0 / 0.45); }
  .phone img { display: block; width: 100%; border-radius: 26px; }
  .p1 { left: -20px; top: 150px; transform: rotate(-6deg); }
  .p2 { left: 165px; top: 70px; z-index: 2; width: 260px; }
  .p3 { left: 375px; top: 150px; transform: rotate(6deg); }
</style>
</head>
<body>
  <div>
    <div class="brand">
      <img src="../../public/pwa-512x512.png" alt="">
      <h1>NearAid</h1>
    </div>
    <p class="tagline">Free help, close to you.</p>
    <p class="sub">Food, health care, shelter, Wi-Fi, water, and restrooms, with what's open right now.</p>
    <div class="chips">
      <span class="chip">Works offline</span>
      <span class="chip">All 50 states + DC</span>
      <span class="chip">9 languages</span>
      <span class="chip">No account, no tracking</span>
    </div>
  </div>
  <div class="phones">
    <div class="phone p1"><img src="../screenshots/phone-needs.webp" alt=""></div>
    <div class="phone p2"><img src="../screenshots/phone-list-light-en.webp" alt=""></div>
    <div class="phone p3"><img src="../screenshots/phone-directions-light-en.webp" alt=""></div>
  </div>
</body>
</html>
